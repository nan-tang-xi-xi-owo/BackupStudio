name: build

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  APP_VERSION: "1.1.1"
  # B2：**必须显式设 PYTHONIOENCODING=utf-8**，不能只靠 PYTHONUTF8。
  # 原因（实测）：PYTHONUTF8=1 只把 *默认* 编码切到 UTF-8；一旦环境里同时存在
  # PYTHONIOENCODING（本机/镜像预设、或 pyinstaller 子进程继承来的值），
  # PYTHONIOENCODING **优先级更高并覆盖** UTF-8 模式对 stdio 的影响 ——
  # 实测 `PYTHONUTF8=1 PYTHONIOENCODING=cp1252 python -c "print(sys.stdout.encoding)"`
  # 输出 cp1252。所以只设 PYTHONUTF8 无法保证 runner 上 print 中文不炸。
  PYTHONIOENCODING: "utf-8"
  PYTHONUTF8: "1"

jobs:
  test:
    name: 单元测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 准备 7-Zip（模拟打包版机器的"有 7z"环境）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/win32/7z | Out-Null
          curl.exe -L -o 7zr.exe https://www.7-zip.org/a/7zr.exe
          curl.exe -L -o 7z-extra.7z https://github.com/ip7z/7zip/releases/download/24.09/7z2409-extra.7z
          ./7zr.exe x 7z-extra.7z -otools/win32/7z-extract -y
          Copy-Item tools/win32/7z-extract/x64/7za.exe tools/win32/7z/
          Copy-Item tools/win32/7z-extract/x64/7za.dll tools/win32/7z/
          Copy-Item tools/win32/7z-extract/x64/7zxa.dll tools/win32/7z/
      - name: pytest（有 7z 环境——模拟打包版用户机器）
        run: python -m pytest tests -q
      - name: pytest（无 7z 环境——模拟纯净安装机器）
        shell: pwsh
        env:
          # 无 7-Zip 环境需要**两个**开关，缺一不可（两者职责不同）：
          # R-10（上游）：测试层 monkeypatch —— tests/conftest.py 读 BACKUPSTUDIO_NO_7Z
          # B8（本分支）：源码级闸门 —— tools.py 的 _disabled_by_env() 读 BACKUPSTUDIO_DISABLE_7Z，
          #   让 find_7z() 直接返回 None。仅改目录名无效：runner 预装
          #   C:\ProgramData\chocolatey\bin\7z.EXE，find_7z() 仍会经 PATH 回退命中。
          BACKUPSTUDIO_NO_7Z: "1"
          BACKUPSTUDIO_DISABLE_7Z: "1"
        run: |
          Rename-Item -Path tools/win32/7z -NewName _7z_off
          python -c "from backupstudio.tools import find_7z; import sys; got=find_7z(); print('find_7z ->', got); sys.exit(0 if got is None else 1)"
          python -m pytest tests -q
          Rename-Item -Path tools/win32/_7z_off -NewName 7z

  test-linux:
    name: 单元测试（Linux）
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: 安装依赖
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt -r requirements-dev.txt'
    - name: 准备 7-Zip 与 Qt 运行时（系统包）
      run: |
        sudo apt-get update -qq
        # PySide6 的 wheel 自带 Qt 库，但依赖系统的 libEGL/libGL/xkbcommon/xcb-*。
        # GitHub 的 ubuntu runner 不像桌面版装了这些；不装的话所有依赖 qapp
        # fixture 的测试会在 setup 阶段 ImportError: libEGL.so.1。
        sudo apt-get install -y -qq p7zip-full libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libfontconfig1 libxrender1 libxi6 libxtst6 libnss3 libasound2
        echo '--- 7-Zip ---'
        command -v 7z 7za 7zz || true
        7z i 2>/dev/null | head -3 || 7za i 2>/dev/null | head -3 || true
        echo '--- Qt 关键库 ---'
        for lib in libEGL.so.1 libGL.so.1 libxkbcommon-x11.so.0; do
          if ldconfig -p | grep -q "$lib"; then echo "  [有] $lib"; else echo "  [缺] $lib"; fi
        done
    - name: 版本一致性门禁（env.APP_VERSION == backupstudio.__version__）
      run: |
        pkg_ver="$(python -c 'import backupstudio; print(backupstudio.__version__)')"
        env_ver="${{ env.APP_VERSION }}"
        echo "env.APP_VERSION=$env_ver  package.__version__=$pkg_ver"
        if [ "$env_ver" != "$pkg_ver" ]; then
          echo "::error::版本漂移：env.APP_VERSION=$env_ver 但 backupstudio.__version__=$pkg_ver"
          echo "::error::请同步 .github/workflows/build.yml 的 env.APP_VERSION 与 backupstudio/__init__.py"
          exit 1
        fi
        echo "版本一致：$env_ver"

    - name: pytest（Linux + 系统 7z）
      env:
        # CI 无显示器：Qt 必须用 offscreen 平台插件
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m pytest tests -q --basetemp="$PWD/build-bt" -rs

  test-macos:
    name: 单元测试（macOS arm64）
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: 安装依赖
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt -r requirements-dev.txt'
    - name: 准备 7-Zip（brew）
      run: 'brew install p7zip || true

        command -v 7z 7za 7zz || true'
    - name: pytest（macOS + 系统 7z）
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m pytest tests -q --basetemp="$PWD/build-bt" -rs

  windows:
    name: Windows exe / 安装包
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 准备随包 7-Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/win32/7z | Out-Null
          curl.exe -L -o 7zr.exe https://www.7-zip.org/a/7zr.exe
          curl.exe -L -o 7z-extra.7z https://github.com/ip7z/7zip/releases/download/24.09/7z2409-extra.7z
          ./7zr.exe x 7z-extra.7z -otools/win32/7z-extract -y
          Copy-Item tools/win32/7z-extract/x64/7za.exe tools/win32/7z/
          Copy-Item tools/win32/7z-extract/x64/7za.dll tools/win32/7z/
          Copy-Item tools/win32/7z-extract/x64/7zxa.dll tools/win32/7z/
          Copy-Item tools/win32/7z-extract/License.txt tools/win32/7z/
      - name: 打包 PyInstaller
        run: python packaging/build.py
      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y
      - name: 生成安装包
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          ./packaging/make-windows-installer.ps1 -ISCC $iscc -SkipBuild
      - name: 便携 zip
        shell: pwsh
        run: |
          $ver = python -c "import sys; sys.path.insert(0, '.'); import backupstudio; print(backupstudio.__version__)"
          if ($LASTEXITCODE -ne 0 -or -not $ver) { throw "无法从 backupstudio.__version__ 取得版本号" }
          $ver = $ver.Trim()
          "便携 zip 版本：$ver"
          Compress-Archive -Path dist/BackupStudio/* -DestinationPath "dist/BackupStudio-$ver-windows-x64.zip" -Force
      - name: 冒烟测试
        shell: pwsh
        run: |
          ./dist/BackupStudio/BackupStudio.exe --version
          ./dist/BackupStudio/BackupStudio.exe selftest

          # R-fix4 门禁①：托盘图标资源必须随包存在（7 个 PNG）。
          # PyInstaller 路线靠 --add-data，理论上不会缺，但一旦 build.py 的
          # _verify_assets() 被绕过就会静默产出无图标版本，故在此二次硬校验。
          $tray = "dist/BackupStudio/_internal/backupstudio/assets/tray"
          if (-not (Test-Path $tray)) { throw "托盘资源目录不存在：$tray" }
          $pngs = @(Get-ChildItem $tray -Filter *.png)
          if ($pngs.Count -lt 7) { throw "托盘 PNG 不足：$($pngs.Count)/7 -> $tray" }
          "托盘 PNG 数量：$($pngs.Count)"

          # R-fix4 门禁②：自启动命令必须能被 argparse 接受。
          # 历史缺陷：安装包写入 "--tray --minimized"（tray 是子命令不是选项）
          # → 登录后 rc=2 立即退出，开机自启完全失效且无提示。
          # 注意：不能用 `<exe> start --minimized --help` 当探针——windowed 版
          # exe 的 --help 退出码不可靠（本机实测 -1），会误报失败。
          # 契约校验脚本同时覆盖「模板写法」与「argparse 正向/反向用例」。
          python packaging/check_autostart_args.py
          if ($LASTEXITCODE -ne 0) { throw "自启动参数契约校验失败（rc=$LASTEXITCODE）" }

          # R-fixN 门禁①：exe 必须带 PE 版本资源（N1）。
          # 历史缺陷：build.py 从未传 --version-file，PyInstaller 日志里只有
          # "Copying 0 resources to EXE" → 安装包有版本、装进去的主程序版本全空。
          $vi = (Get-Item dist/BackupStudio/BackupStudio.exe).VersionInfo
          "FileVersion=$($vi.FileVersion) ProductVersion=$($vi.ProductVersion)"
          "CompanyName=$($vi.CompanyName) ProductName=$($vi.ProductName)"
          if ([string]::IsNullOrWhiteSpace($vi.FileVersion)) { throw "exe 没有 FileVersion（N1 复发）" }
          if ([string]::IsNullOrWhiteSpace($vi.ProductVersion)) { throw "exe 没有 ProductVersion（N1 复发）" }
          if ([string]::IsNullOrWhiteSpace($vi.CompanyName)) { throw "exe 没有 CompanyName（N1 复发）" }
          if ([string]::IsNullOrWhiteSpace($vi.ProductName)) { throw "exe 没有 ProductName（N1 复发）" }
          if ([string]::IsNullOrWhiteSpace($vi.LegalCopyright)) { throw "exe 没有 LegalCopyright（N1 复发）" }
          $pkgver = python -c "import sys; sys.path.insert(0, '.'); import backupstudio; print(backupstudio.__version__)"
          if (-not $vi.FileVersion.StartsWith($pkgver.Trim())) {
            throw "exe FileVersion=$($vi.FileVersion) 与包版本 $pkgver 不一致"
          }
          "exe 版本资源 OK：$($vi.FileVersion)"

          # R-fixN 门禁②：7-Zip 许可必须随包分发（N8，LGPL 合规）。
          # 历史缺陷：packaging/THIRD-PARTY-7ZIP.txt 存在却从未被复制进产物，
          # 冻结后 _internal/ 里连 THIRD-PARTY-NOTICES.txt 都没有。
          foreach ($f in @("THIRD-PARTY-7ZIP.txt", "THIRD-PARTY-NOTICES.txt")) {
            if (-not (Test-Path "dist/BackupStudio/$f")) { throw "产物根目录缺少 $f（N8 复发）" }
            if (-not (Test-Path "dist/BackupStudio/_internal/$f")) { throw "_internal 缺少 $f（设置页读不到）" }
          }
          "随附许可 OK：7-Zip 许可已在产物根目录与 _internal 各一份"

          # R-fixN 门禁③：py.typed 必须在产物里（N5，PEP 561）。
          if (-not (Test-Path "dist/BackupStudio/_internal/backupstudio/py.typed")) {
            throw "产物缺少 backupstudio/py.typed（N5 复发）"
          }
          "py.typed OK"

                              # R-fix4 门禁③：真跑一次备份（不是只看 --version）。
          # 两个关键坑（都会被 CI 放大成本地看不出的失败）：
          #   1) `--windowed` 打包的 exe 属于 GUI 子系统，PowerShell 用 `&` 调用**不等待**
          #      → 断言时文件还没写出来。必须用 Start-Process -Wait -PassThru。
          #   2) windowed exe 的 $LASTEXITCODE 不可靠，改用 Start-Process 返回的 ExitCode。
          $work = (Get-Location).Path
          $cfgD = Join-Path $work "smoke-cfg"
          $srcD = Join-Path $work "smoke-src"
          $dstD = Join-Path $work "smoke-dst"
          Remove-Item -Recurse -Force $cfgD, $srcD, $dstD -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $cfgD, $srcD, $dstD | Out-Null
          Set-Content (Join-Path $srcD "hello.txt") "windows smoke"
          $env:BACKUPSTUDIO_CONFIG_DIR = $cfgD
          $exePath = Join-Path $work "dist\BackupStudio\BackupStudio.exe"
          "配置目录：$env:BACKUPSTUDIO_CONFIG_DIR"
          "输入目录：$srcD"
          "输出目录：$dstD"

          function Invoke-Cli {
            param([string[]]$Arguments)
            $p = Start-Process -FilePath $exePath -ArgumentList $Arguments -Wait -PassThru -NoNewWindow `
                 -RedirectStandardOutput "$work\cli-out.txt" -RedirectStandardError "$work\cli-err.txt"
            $stdout = if (Test-Path "$work\cli-out.txt") { Get-Content "$work\cli-out.txt" -Raw } else { "" }
            $stderr = if (Test-Path "$work\cli-err.txt") { Get-Content "$work\cli-err.txt" -Raw } else { "" }
            if ($stdout) { $stdout.TrimEnd() }
            if ($stderr) { $stderr.TrimEnd() }
            return $p.ExitCode
          }

          $rc = Invoke-Cli @("task", "add", "--name", "smoke", "--source", $srcD, "--dest", $dstD, "--format", "zip")
          "task add 退出码：$rc"
          $tasksFile = Join-Path $cfgD "tasks.json"
          if (-not (Test-Path $tasksFile)) {
            "配置目录内容："
            Get-ChildItem $cfgD -Recurse -ErrorAction SilentlyContinue | ForEach-Object { "  " + $_.FullName }
            throw "task add 未写入 tasks.json：$tasksFile（rc=$rc）"
          }
          "tasks.json 已写入：" + (Get-Item $tasksFile).Length + " B"

          $rc2 = Invoke-Cli @("run", "--all")
          "run --all 退出码：$rc2"
          $zip = @(Get-ChildItem $dstD -Filter *.zip -ErrorAction SilentlyContinue)
          if ($zip.Count -lt 1) {
            "输出目录内容："
            Get-ChildItem $dstD -ErrorAction SilentlyContinue | ForEach-Object { "  " + $_.Name }
            throw "备份未产出 zip：$dstD（rc=$rc2）"
          }
          "真跑备份 OK：" + $zip[0].Name + " (" + $zip[0].Length + " B)"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/BackupStudio-*-windows-x64.zip
            dist/BackupStudio-Setup-*.exe

  macos-arm64:
    name: macOS arm64 dmg
    # B5：macos-14 已 deprecated（2026-11-02 完全下线），迁到 macos-15
    runs-on: macos-15
    # **只依赖 	est，不依赖 	est-macos**（打包与单测解耦）：
    # macOS arm64 runner 容量不足时 	est-macos 会排队 15 分钟后被平台取消，
    # 若这里是 [test, test-macos]，dmg 会陪着一起 skip —— 一挂全挂。
    # 而 	est 是跨平台纯 Python 单测（Windows 上跑），门禁强度不受影响。
    # 另注：macos-15-intel 是**另一个资源池**（历史 30 次 0 取消），
    # 它没必要陪 arm64 一起等。
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 准备 7-Zip（Apple Silicon）
        run: |
          mkdir -p tools/darwin/7z
          curl -L -o /tmp/7z-mac.tar.xz https://www.7-zip.org/a/7z2301-mac.tar.xz
          tar -xf /tmp/7z-mac.tar.xz -C tools/darwin/7z
      - name: 打包 .app
        run: python packaging/build.py
      - name: 校验 Info.plist（版本号 / 包标识）
        run: |
          set -euo pipefail
          # R-fix4 门禁：Info.plist 的 CFBundleShortVersionString 必须是 1.1.0，
          # 不能是 0.0.0。历史缺陷：PyInstaller 的 BUNDLE 模板从不传 version=，
          # Info.plist 恒为 0.0.0，而 dmg 文件名却是 1.1.0（两个 dmg 都中招）。
          PLIST="dist/BackupStudio.app/Contents/Info.plist"
          test -f "$PLIST" || { echo "缺少 $PLIST"; exit 1; }
          got="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          ident="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          echo "CFBundleShortVersionString=$got"
          echo "CFBundleIdentifier=$ident"
          if [ "$got" = "0.0.0" ] || [ -z "$got" ]; then
            echo "版本号无效（$got）：Info.plist 未取到真实版本"; exit 1
          fi
          if [ "$ident" != "io.github.backupstudio.BackupStudio" ]; then
            echo "CFBundleIdentifier 应为 io.github.backupstudio.BackupStudio，实际 $ident"; exit 1
          fi
          # 与包自身版本对齐（dmg 文件名用的是同一真源）
          pkgver="$(python -c 'import backupstudio; print(backupstudio.__version__)')"
          if [ "$got" != "$pkgver" ]; then
            echo "Info.plist 版本 $got != 包版本 $pkgver"; exit 1
          fi
          echo "Info.plist OK"
      - name: 生成 DMG
        run: bash packaging/make-dmg.sh
      - name: 校验 DMG 文件名与 Info.plist 版本一致
        run: |
          set -euo pipefail
          # R-fix4 门禁：dmg 文件名里的版本号与 .app 内部版本号必须一致。
          # 历史缺陷正是「文件名 1.1.0、内部 0.0.0」，两个 dmg 都中招。
          pkgver="$(python -c 'import backupstudio; print(backupstudio.__version__)')"
          ls -la dist/*.dmg
          test -f "dist/BackupStudio-${pkgver}-arm64.dmg" || {
            echo "未找到预期产物 dist/BackupStudio-${pkgver}-arm64.dmg"; exit 1; }
          echo "DMG 命名 OK: BackupStudio-${pkgver}-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.dmg

  macos-x64:
    name: macOS x64 dmg
    # B5：macos-13 已于 2025-12-08 退役（runner 永远排队 → 24h 后 cancelled），
    # 官方指定迁移目标为 macos-15-intel（最后一个 x86_64 镜像）
    runs-on: macos-15-intel
    # **只依赖 	est，不依赖 	est-macos**（打包与单测解耦）：
    # macOS arm64 runner 容量不足时 	est-macos 会排队 15 分钟后被平台取消，
    # 若这里是 [test, test-macos]，dmg 会陪着一起 skip —— 一挂全挂。
    # 而 	est 是跨平台纯 Python 单测（Windows 上跑），门禁强度不受影响。
    # 另注：macos-15-intel 是**另一个资源池**（历史 30 次 0 取消），
    # 它没必要陪 arm64 一起等。
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 准备 7-Zip（Intel）
        run: |
          mkdir -p tools/darwin/7z
          curl -L -o /tmp/7z-mac.tar.xz https://www.7-zip.org/a/7z2301-mac.tar.xz
          tar -xf /tmp/7z-mac.tar.xz -C tools/darwin/7z
      - name: 打包 .app
        run: python packaging/build.py
      - name: 校验 Info.plist（版本号 / 包标识）
        run: |
          set -euo pipefail
          # R-fix4 门禁：与 arm64 job 相同，两个架构都必须过。
          PLIST="dist/BackupStudio.app/Contents/Info.plist"
          test -f "$PLIST" || { echo "缺少 $PLIST"; exit 1; }
          got="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          ident="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          echo "CFBundleShortVersionString=$got"
          echo "CFBundleIdentifier=$ident"
          if [ "$got" = "0.0.0" ] || [ -z "$got" ]; then
            echo "版本号无效（$got）：Info.plist 未取到真实版本"; exit 1
          fi
          if [ "$ident" != "io.github.backupstudio.BackupStudio" ]; then
            echo "CFBundleIdentifier 应为 io.github.backupstudio.BackupStudio，实际 $ident"; exit 1
          fi
          pkgver="$(python -c 'import backupstudio; print(backupstudio.__version__)')"
          if [ "$got" != "$pkgver" ]; then
            echo "Info.plist 版本 $got != 包版本 $pkgver"; exit 1
          fi
          echo "Info.plist OK"
      - name: 生成 DMG
        run: bash packaging/make-dmg.sh
      - name: 校验 DMG 文件名与 Info.plist 版本一致
        run: |
          set -euo pipefail
          pkgver="$(python -c 'import backupstudio; print(backupstudio.__version__)')"
          ls -la dist/*.dmg
          test -f "dist/BackupStudio-${pkgver}-x64.dmg" || {
            echo "未找到预期产物 dist/BackupStudio-${pkgver}-x64.dmg"; exit 1; }
          echo "DMG 命名 OK: BackupStudio-${pkgver}-x64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: dist/*.dmg

  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    needs: [test, test-linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file libegl1 libxkbcommon-x11-0 libxcb-cursor0 libnotify-bin
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 准备 7-Zip（Linux）
        run: |
          mkdir -p tools/linux/7z
          curl -L -o /tmp/7z-linux.tar.xz https://www.7-zip.org/a/7z2301-linux-x64.tar.xz
          tar -xf /tmp/7z-linux.tar.xz -C tools/linux/7z
      - name: 打包
        run: |
          python packaging/build.py
          bash packaging/make-appimage.sh
      - name: 烟雾测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/BackupStudio-*-x86_64.AppImage --version
          ./dist/BackupStudio-*-x86_64.AppImage info | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage

  linux-flatpak:
    name: Flatpak
    runs-on: ubuntu-22.04
    needs: [test, test-linux]
    container:
      # B6：原镜像 bilelmoussaoui/flatpak-github-actions:kde-6.8 的 tag **从未发布**
      # （实测 Docker Hub 27 个 tag，最大 kde-6.7），docker pull 直接 404 → job 必红。
      # 官方迁移到 ghcr.io/flathub-infra/...，且 tag 必须与 manifest 的运行时
      # （org.freedesktop.Platform 24.08）对齐，否则容器内没有对应 SDK。
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: 构建 Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: BackupStudio.flatpak
          manifest-path: packaging/io.github.backupstudio.BackupStudio.yml
          cache-key: flatpak-${{ github.sha }}
          build-bundle: true
          # N1：flatpak-builder 自带 upload-artifact（默认 true），会与下一步
          # 手动上传的 linux-flatpak 重复（同 digest 同大小），导致 Release 上
          # 出现两个一模一样的 flatpak。这里关掉，只保留我们自己的 artifact。
          upload-artifact: false
      # R-4：构建"成功"不等于包能用——此前 --no-deps 让 job 绿着产出
      # ImportError 的坏包。这一步必须让 job 失败，不许 || true 吞掉。
      - name: 冒烟测试（Flatpak）
        run: |
          set -euo pipefail
          # 先备齐运行时（--user 安装需要它）。幂等，已存在则跳过。
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Platform.GL.default//24.08

          flatpak install --user -y --noninteractive --bundle BackupStudio.flatpak

          # 结构门禁：直接查装好的文件树，逐项确认运行期依赖真的进包了。
          # 这一步就是当初 --no-deps 会挂掉而"构建成功"却放过的地方。
          # 注意 rarfile 是单文件模块（rarfile.py），不是目录，故单独判断。
          APP="$(flatpak info --show-location io.github.backupstudio.BackupStudio)/files"
          ls "$APP/bin"
          test -x "$APP/bin/backupstudio"
          test -x "$APP/bin/7zz"
          SP="$(ls -d "$APP"/lib/python3.*/site-packages)"
          for pkg in PySide6 py7zr zmq psutil Cryptodome zstandard pyzstd; do
            test -e "$SP/$pkg" || { echo "缺少依赖：$pkg"; exit 1; }
          done
          test -e "$SP/rarfile.py" -o -e "$SP/rarfile" || { echo "缺少依赖：rarfile"; exit 1; }
          echo "包结构 OK：入口、7zz 与全部运行期依赖均在包内"

          # 运行时门禁：真跑一遍（依赖缺失即非零退出）。
          flatpak run --command=backupstudio io.github.backupstudio.BackupStudio --version
          flatpak run --command=python3 io.github.backupstudio.BackupStudio \
            -c "import PySide6, py7zr, zmq, psutil, Cryptodome, zstandard, pyzstd, rarfile; print('deps ok')"
          flatpak run --command=python3 io.github.backupstudio.BackupStudio \
            -c "import backupstudio; print('app ok', backupstudio.__version__)"

          # R-fix4 门禁①：托盘图标资源必须真的进包。
          # 此前 pyproject.toml 只声明了 py.typed，而 Flatpak 走
          # `pip3 install --prefix=/app`（非代码数据不入包）→ site-packages 内
          # 没有 backupstudio/assets/tray/*.png，Flatpak 版托盘图标全缺。
          # 故光测「deps ok」不够：依赖齐了、资源仍可能缺。这里做硬断言。
          # 注：必须写成单行——run: | 块标量里出现顶格 Python 会破坏 YAML 解析。
          flatpak run --command=python3 io.github.backupstudio.BackupStudio -c "import backupstudio, pathlib; p = pathlib.Path(backupstudio.__file__).parent / 'assets' / 'tray'; pngs = sorted(p.glob('*.png')); print('tray png count:', len(pngs)); assert len(pngs) >= 7, f'托盘资源缺失: {len(pngs)}/7 -> {p}'; print('tray assets ok')"

          # R-fix4 门禁②：.desktop 必须真的被装上且字段完整。
          # 之前只 build 不校验，桌面项写错也不会有任何 job 变红。
          DESKTOP="$(flatpak info --show-location io.github.backupstudio.BackupStudio)/files/share/applications/io.github.backupstudio.BackupStudio.desktop"
          test -f "$DESKTOP" || { echo "缺少 .desktop：$DESKTOP"; exit 1; }
          grep -q '^\[Desktop Entry\]' "$DESKTOP" || { echo ".desktop 缺 [Desktop Entry]"; exit 1; }
          grep -q '^Exec=backupstudio' "$DESKTOP" || { echo ".desktop 的 Exec 未指向 backupstudio"; exit 1; }
          # CRLF 会让 GLib 解析失败的 keyfile；DPKG/Flatpak 桌面项必须是 LF。
          if grep -q $'\r' "$DESKTOP"; then echo ".desktop 含 CR（应为 LF）"; exit 1; fi
          echo ".desktop OK:"
          cat "$DESKTOP"

          # ------------------------------------------------------------------
          # R-fixN 门禁（N2 / N3 / N4）—— 这三条只能在真 Flatpak 沙箱里验证
          # ------------------------------------------------------------------

          # N2：manifest 不得强制 BACKUPSTUDIO_CONFIG_DIR 到不可写的 /var/config。
          # 历史缺陷：沙箱内 /var/config 不可写 → 程序回退到私有 tmpfs →
          # 每次重启丢光任务/设置/调度记录，而 selftest 仍显示 [OK] 配置目录可写。
          if grep -q 'BACKUPSTUDIO_CONFIG_DIR' packaging/io.github.backupstudio.BackupStudio.yml; then
            echo "manifest 仍强制配置目录（N2 复发）"; exit 1
          fi
          # 配置目录必须落在 ~/.var/app/<app-id>/ 下（Flatpak 的持久化位置）
          CFG_JSON="$(flatpak run --command=backupstudio io.github.backupstudio.BackupStudio selftest --json)"
          echo "$CFG_JSON"
          python3 - "$CFG_JSON" <<'PY'
          import json, sys, pathlib
          payload = json.loads(sys.argv[1])
          cfg = pathlib.Path(payload["config_dir"])
          print("config_dir =", cfg)
          assert ".var/app/io.github.backupstudio.BackupStudio" in str(cfg), (
              f"配置目录不在 ~/.var/app/<app-id> 下（重启会丢）：{cfg}"
          )
          assert payload["config_fell_back"] is False, (
              f"配置目录发生了回退：{payload['config_reason']}"
          )
          assert payload["config_override_ignored"] is False, (
              f"配置目录覆盖被忽略：{payload['config_reason']}"
          )
          print("Flatpak 配置目录 OK（持久、未回退）")
          PY
          if [ $? -ne 0 ]; then echo "Flatpak 配置目录门禁失败（N2）"; exit 1; fi

          # 再验证一次：写进去的配置在**新进程**里仍然读得到（等价于"重启后还在"）。
          flatpak run --command=backupstudio io.github.backupstudio.BackupStudio selftest --json > /tmp/bs-st.json
          CFG1="$(python3 -c 'import json;print(json.load(open("/tmp/bs-st.json"))["config_dir"])')"
          flatpak run --command=backupstudio io.github.backupstudio.BackupStudio \
            task add --name ci-persist --source /tmp --dest /tmp --format zip || true
          flatpak run --command=backupstudio io.github.backupstudio.BackupStudio task list > /tmp/bs-tl.txt
          flatpak run --command=backupstudio io.github.backupstudio.BackupStudio task list | grep -q ci-persist \
            || { echo "任务没有持久化到 $CFG1（N2 复发：配置写进了临时目录）"; exit 1; }
          echo "配置持久化 OK：$CFG1"

          # N3：沙箱内的 selftest 必须**如实**说明自启动不受支持（而不是报 OK）。
          flatpak run --command=backupstudio io.github.backupstudio.BackupStudio selftest --json \
            | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          sb = payload["sandbox"]
          print("sandbox =", sb)
          assert sb["is_flatpak"] is True, "沙箱探测失败：没认出自己在 Flatpak 里"
          assert sb["autostart_supported"] is False, "Flatpak 内仍声称支持开机自启（N3 复发）"
          assert sb["daemon_supported"] is False, "Flatpak 内仍声称支持独立守护进程（N4 复发）"
          warn = " ".join(payload["warnings"])
          assert "自启" in warn, f"selftest 没有为自启给出 WARN：{warn}"
          assert "调度器" in warn, f"selftest 没有为守护进程给出 WARN：{warn}"
          print("沙箱能力边界 OK（如实告知不支持）")
          '
          if [ $? -ne 0 ]; then echo "Flatpak 沙箱能力边界门禁失败（N3/N4）"; exit 1; fi

          # N4：manifest 必须声明文件门户总线名。
          grep -q 'org.freedesktop.portal.Desktop' packaging/io.github.backupstudio.BackupStudio.yml \
            || { echo "manifest 缺少 --talk-name=org.freedesktop.portal.Desktop（N4 复发）"; exit 1; }
          echo "文件门户声明 OK"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: BackupStudio.flatpak

  release:
    name: 发布 Release
    # ## if 条件的三个部分，缺一不可（全部有实证，见下）
    #
    # 1. `!cancelled()` —— **上游被 cancelled / skipped 时仍运行**
    #    macOS arm64 runner 容量不足时 GitHub 会把 test-macos 判为 cancelled
    #    （runner_id=0、steps=0、排队 901 秒后放弃），needs 里含它 → 默认的
    #    success 语义会让本 job 永久 skip。
    #
    #    机制：官方实现 `CancelledFunction.cs` 是
    #        `return jobStatus == ActionResult.Cancelled;`
    #    读的是 **JobContext.Status（整个 run 的状态）**，代码里没有任何遍历
    #    needs 的逻辑 —— 所以上游 job 被取消不会让它返回 true。
    #    但**整个 workflow 被用户 Cancel** 时它返回 true → 本 job 不跑（正确）。
    #
    # 2. `!failure()` —— **上游真失败时必须拦住**（实测发现的缺口）
    #    实证矩阵（本仓库 6 个探针 run）：
    #        上游 cancelled → `!cancelled()` 放行  ✅ 期望放行
    #        上游 skipped   → `!cancelled()` 放行  ✅ 期望放行
    #        上游 failure   → `!cancelled()` **仍放行**  ❌ 期望拦住！
    #    即 `!cancelled()` 挡不住 failure。若 Windows/Linux 构建真失败，
    #    release 仍会发版 —— 只靠「门禁 B」兜底太晚。加上 `!failure()` 后三者全对。
    #
    # 3. tag 判断 —— 只有打 tag 才发版（分支 push 不发）
    #
    # ## 为什么不用 `always()`（同样实证）
    # 手动 Cancel 整个 run 后：
    #     `always()` 的 job        → **success，3 个 step 真跑完了**（会发版！）
    #     `!cancelled()` 的 job    → cancelled，steps=0，不分配 runner
    # 官方文档也警告 always() 用于关键任务可能让 workflow 挂起到超时。
    #
    # ## 为什么 needs 必须保留 macOS 三项
    # `needs` 同时承担「成功后」和「之后」两件事（官方原文：
    # "must complete successfully **before this job will run**"）。
    # 删掉 macOS 会让 release 与 dmg job 并行 → `download-artifact` 抢跑
    # → 门禁 B 对**健康构建**误报红。保留 needs + `!cancelled()` 才是对的。
    if: ${{ !failure() && !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    # **needs 必须保留 macOS 三项**，即使它们可能被取消。
    #
    # 为什么不能删（红队实测的依赖闭包）：GitHub 文档说 needs 承担两件事 ——
    # 「成功后」**和**「之后」（"must complete successfully **before this job
    # will run**"）。删掉 macOS 的 needs 不只解除门禁，还**删掉了排序**：
    # macos-arm64/macos-x64 会与 release 并行 → **即使 macOS 完全正常**，
    # release 也可能抢先 download 到「缺 2 个 dmg」→ 门禁 B 误报红。
    #
    # 正确做法是保留 needs（保住顺序）+ 用 `!cancelled()` 解除「必须成功」：
    # 上游被 cancelled/skipped 时 release 仍运行，同样不被 macOS 阻塞，且无竞态。
    #
    # 缺硬件产物由「门禁 B」显式拦住（绝不静默发残缺版）。
    needs: [windows, macos-arm64, macos-x64, linux-appimage, linux-flatpak, test-linux, test-macos]
    steps:
      # 门禁 A 要读 backupstudio/__init__.py，所以不能只 sparse-checkout docs。
      # 仓库本身不大，全量 checkout 更省心。
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # ── 门禁 A：tag 必须与源码版本号一致 ──
      # 原门禁只比对 env.APP_VERSION ↔ __version__（同源于仓库，与 tag 无关）。
      # 打 v1.2.0 而源码仍是 1.1.1 时，会发出「标题是 v1.2.0、文件名全是 1.1.1」
      # 的 release —— 用户完全无法从文件名看出问题。
      - name: 门禁 A —— tag 与源码版本号一致
        shell: bash
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          # **必须 import 取真值，不能用正则扫文件**（红队实测的 fail-open）：
          # `re.search` 无行首锚定，会匹配到注释行 ——
          #     # __version__ = "1.1.1"     ← 注释抢先匹配
          #     __version__ = "1.1.0"      ← 真值
          # tag=v1.1.1 时 rc=0 放行并打印 ✅，而实际版本是 1.1.0。
          # import 是唯一真源，也与 test-linux job 与 packaging/build.py 一致。
          ver=$(python3 -c 'import backupstudio; print(backupstudio.__version__)')
          echo "tag=$tag  源码 __version__=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag（$tag）与源码版本（$ver）不一致 —— 拒绝发版"
            echo "::error::请先把 backupstudio/__init__.py、pyproject.toml、"
            echo "::error::.github/workflows/build.yml 的 APP_VERSION 都改成 $tag 再打 tag"
            exit 1
          fi
          echo "✅ tag 与源码版本一致：$ver"

      # ── 门禁 B：产物清单必须齐全 ──
      # 风险链（审计实证）：
      #   download-artifact 无 name/pattern（全量模式）→ v4 源码里空列表只 core.info、
      #   **不抛异常**；叠加 fail_on_unmatched_files: false 与 sha256sum * || true
      #   → **缺 macOS 产物时 release 照样成功**，SHA256SUMS 只有 4 行、格式完全正常。
      #
      # 所以必须显式比对期望清单。缺任何一个都**硬失败**，把静默变成显式。
      - name: 门禁 B —— 产物清单齐全
        shell: bash
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          expected="BackupStudio-${ver}-windows-x64.zip
          BackupStudio-Setup-${ver}.exe
          BackupStudio-${ver}-arm64.dmg
          BackupStudio-${ver}-x64.dmg
          BackupStudio-${ver}-x86_64.AppImage
          BackupStudio.flatpak"
          echo "=== 期望产物（6 个）==="
          echo "$expected"
          echo
          echo "=== 实际拿到 ==="
          ls -la artifacts/ || true
          echo
          missing=""
          for f in $expected; do
            if [ -f "artifacts/$f" ]; then
              echo "✅ $f"
            else
              echo "❌ 缺失：$f"
              missing="$missing $f"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::产物不全，拒绝发版。缺少：$missing"
            echo "::error::macOS arm64 runner 容量不足时，请用 gh run rerun <run-id> --failed 补齐"
            echo "::error::（artifact 是 run 级作用域，只重跑本 job 补不出 dmg）"
            exit 1
          fi
          echo
          echo "✅ 6 个产物齐全"

      - name: 生成校验值
        shell: bash
        run: |
          cd artifacts
          ls -la
          # 门禁 B 已确保 6 个文件都在，这里不再 || true
          sha256sum BackupStudio* > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt
      - name: 选择发布说明
        id: notes
        run: |
          f="docs/RELEASE_NOTES_${GITHUB_REF_NAME#v}.md"
          if [ -f "$f" ]; then
            echo "使用发布说明：$f"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=$f" >> "$GITHUB_OUTPUT"
          else
            echo "未找到 $f，改用 GitHub 自动生成的发布说明"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 创建 Release（使用发布说明文件）
        if: steps.notes.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: BackupStudio ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: artifacts/**/*
          fail_on_unmatched_files: false
      - name: 创建 Release（自动生成说明）
        if: steps.notes.outputs.found != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: BackupStudio ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*
          fail_on_unmatched_files: false
