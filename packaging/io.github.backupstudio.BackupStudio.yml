{
  "app-id": "io.github.backupstudio.BackupStudio",
  "runtime": "org.freedesktop.Platform",
  "runtime-version": "24.08",
  "sdk": "org.freedesktop.Sdk",
  "command": "backupstudio",
  "finish-args": [
    "--share=network",
    "--socket=wayland",
    "--socket=fallback-x11",
    "--socket=pulseaudio",
    "--share=ipc",
    "--device=dri",
    "--filesystem=home",
    "--filesystem=/media",
    "--filesystem=/mnt",
    "--filesystem=/run/media",
    "--talk-name=org.freedesktop.Notifications",
    "--talk-name=org.kde.StatusNotifierWatcher",
    "--env=QT_QPA_PLATFORM=wayland;xcb",
    "--env=BACKUPSTUDIO_CONFIG_DIR=/var/config/backupstudio"
  ],
  "modules": [
    {
      "name": "p7zip",
      "buildsystem": "simple",
      "build-commands": [
        "tar xf 7z2301-linux-x64.tar.xz -C .",
        "install -Dm755 7zz /app/bin/7zz",
        "install -Dm755 7zzs /app/bin/7zzs || true",
        "ln -sf /app/bin/7zz /app/bin/7z",
        "ln -sf /app/bin/7zz /app/bin/7za"
      ],
      "sources": [
        {
          "type": "file",
          "url": "https://www.7-zip.org/a/7z2301-linux-x64.tar.xz",
          "sha256": "23babcab045b78016e443f862363e4ab63c77d75bc715c0b3463f6134cbcf318"
        }
      ],
    },
    {
      "name": "backupstudio",
      "buildsystem": "simple",
      "build-commands": [
        "pip3 install --prefix=/app --no-deps --no-build-isolation .",
        "install -Dm644 packaging/icon.png /app/share/icons/hicolor/512x512/apps/io.github.backupstudio.BackupStudio.png",
        "install -Dm644 packaging/io.github.backupstudio.BackupStudio.desktop /app/share/applications/io.github.backupstudio.BackupStudio.desktop",
        "install -Dm644 packaging/io.github.backupstudio.BackupStudio.metainfo.xml /app/share/metainfo/io.github.backupstudio.BackupStudio.metainfo.xml"
      ],
      "sources": [
        { "type": "dir", "path": ".." }
      ]
    }
  ]
}
