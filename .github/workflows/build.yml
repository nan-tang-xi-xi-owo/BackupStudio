name: build

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  APP_VERSION: "1.1.0"
  # B2：**必须显式设 PYTHONIOENCODING=utf-8**，不能只靠 PYTHONUTF8。
  # 原因（实测）：PYTHONUTF8=1 只把 *默认* 编码切到 UTF-8；一旦环境里同时存在
  # PYTHONIOENCODING（本机/镜像预设、或 pyinstaller 子进程继承来的值），
  # PYTHONIOENCODING **优先级更高并覆盖** UTF-8 模式对 stdio 的影响 ——
  # 实测 `PYTHONUTF8=1 PYTHONIOENCODING=cp1252 python -c "print(sys.stdout.encoding)"`
  # 输出 cp1252。所以只设 PYTHONUTF8 无法保证 runner 上 print 中文不炸。
  PYTHONIOENCODING: "utf-8"
  PYTHONUTF8: "1"

jobs:
  test:
    name: 单元测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 准备 7-Zip（模拟打包版机器的"有 7z"环境）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/win32/7z | Out-Null
          curl.exe -L -o 7zr.exe https://www.7-zip.org/a/7zr.exe
          curl.exe -L -o 7z-extra.7z https://github.com/ip7z/7zip/releases/download/24.09/7z2409-extra.7z
          ./7zr.exe x 7z-extra.7z -otools/win32/7z-extract -y
          Copy-Item tools/win32/7z-extract/x64/7za.exe tools/win32/7z/
          Copy-Item tools/win32/7z-extract/x64/7za.dll tools/win32/7z/
          Copy-Item tools/win32/7z-extract/x64/7zxa.dll tools/win32/7z/
      - name: pytest（有 7z 环境——模拟打包版用户机器）
        run: python -m pytest tests -q
      - name: pytest（无 7z 环境——模拟纯净安装机器）
        shell: pwsh
        env:
          # B8：光改目录名**不等于**无 7z —— find_7z() 还会回落到 PATH
          # （tools.py:107 `_which_many`）与 Program Files（tools.py:110），而
          # windows-latest 预装 7-Zip（实测 C:\ProgramData\chocolatey\bin\7z.EXE）。
          # 这就是"两遍都 137 passed / 0 skip"、双环境门禁从未生效的原因。
          # 这里用 BACKUPSTUDIO_DISABLE_7Z=1 让 find_7z() 在源头直接返回 None
          #（比改 PATH 更可靠：7z 分散在 Chocolatey/PATH/Program Files 三处）。
          BACKUPSTUDIO_DISABLE_7Z: "1"
        run: |
          Rename-Item -Path tools/win32/7z -NewName _7z_off
          python -c "from backupstudio.tools import find_7z; import sys; got=find_7z(); print('find_7z ->', got); sys.exit(0 if got is None else 1)"
          python -m pytest tests -q
          Rename-Item -Path tools/win32/_7z_off -NewName 7z

  windows:
    name: Windows exe / 安装包
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 准备随包 7-Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/win32/7z | Out-Null
          curl.exe -L -o 7zr.exe https://www.7-zip.org/a/7zr.exe
          curl.exe -L -o 7z-extra.7z https://github.com/ip7z/7zip/releases/download/24.09/7z2409-extra.7z
          ./7zr.exe x 7z-extra.7z -otools/win32/7z-extract -y
          Copy-Item tools/win32/7z-extract/x64/7za.exe tools/win32/7z/
          Copy-Item tools/win32/7z-extract/x64/7za.dll tools/win32/7z/
          Copy-Item tools/win32/7z-extract/x64/7zxa.dll tools/win32/7z/
          Copy-Item tools/win32/7z-extract/License.txt tools/win32/7z/
      - name: 打包 PyInstaller
        run: python packaging/build.py
      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y
      - name: 生成安装包
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          ./packaging/make-windows-installer.ps1 -ISCC $iscc -SkipBuild
      - name: 便携 zip
        shell: pwsh
        run: Compress-Archive -Path dist/BackupStudio/* -DestinationPath dist/BackupStudio-${{ env.APP_VERSION }}-windows-x64.zip
      - name: 冒烟测试
        shell: pwsh
        run: |
          ./dist/BackupStudio/BackupStudio.exe --version
          ./dist/BackupStudio/BackupStudio.exe selftest
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/BackupStudio-${{ env.APP_VERSION }}-windows-x64.zip
            dist/BackupStudio-Setup-*.exe

  macos-arm64:
    name: macOS arm64 dmg
    # B5：macos-14 已 deprecated（2026-11-02 完全下线），迁到 macos-15
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 准备 7-Zip（Apple Silicon）
        run: |
          mkdir -p tools/darwin/7z
          curl -L -o /tmp/7z-mac.tar.xz https://www.7-zip.org/a/7z2301-mac.tar.xz
          tar -xf /tmp/7z-mac.tar.xz -C tools/darwin/7z
      - name: 打包 .app
        run: python packaging/build.py
      - name: 生成 DMG
        run: bash packaging/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.dmg

  macos-x64:
    name: macOS x64 dmg
    # B5：macos-13 已于 2025-12-08 退役（runner 永远排队 → 24h 后 cancelled），
    # 官方指定迁移目标为 macos-15-intel（最后一个 x86_64 镜像）
    runs-on: macos-15-intel
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 准备 7-Zip（Intel）
        run: |
          mkdir -p tools/darwin/7z
          curl -L -o /tmp/7z-mac.tar.xz https://www.7-zip.org/a/7z2301-mac.tar.xz
          tar -xf /tmp/7z-mac.tar.xz -C tools/darwin/7z
      - name: 打包 .app
        run: python packaging/build.py
      - name: 生成 DMG
        run: bash packaging/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: dist/*.dmg

  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file libegl1 libxkbcommon-x11-0 libxcb-cursor0 libnotify-bin
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 准备 7-Zip（Linux）
        run: |
          mkdir -p tools/linux/7z
          curl -L -o /tmp/7z-linux.tar.xz https://www.7-zip.org/a/7z2301-linux-x64.tar.xz
          tar -xf /tmp/7z-linux.tar.xz -C tools/linux/7z
      - name: 打包
        run: |
          python packaging/build.py
          bash packaging/make-appimage.sh
      - name: 烟雾测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/BackupStudio-*-x86_64.AppImage --version
          ./dist/BackupStudio-*-x86_64.AppImage info | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage

  linux-flatpak:
    name: Flatpak
    runs-on: ubuntu-22.04
    needs: test
    container:
      # B6：原镜像 bilelmoussaoui/flatpak-github-actions:kde-6.8 的 tag **从未发布**
      # （实测 Docker Hub 27 个 tag，最大 kde-6.7），docker pull 直接 404 → job 必红。
      # 官方迁移到 ghcr.io/flathub-infra/...，且 tag 必须与 manifest 的运行时
      # （org.freedesktop.Platform 24.08）对齐，否则容器内没有对应 SDK。
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: 构建 Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: BackupStudio.flatpak
          manifest-path: packaging/io.github.backupstudio.BackupStudio.yml
          cache-key: flatpak-${{ github.sha }}
          build-bundle: true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: BackupStudio.flatpak

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [windows, macos-arm64, macos-x64, linux-appimage, linux-flatpak]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 生成校验值
        run: |
          cd artifacts
          ls -la
          sha256sum * > SHA256SUMS.txt || true
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: BackupStudio ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES_${{ env.APP_VERSION }}.md
          files: artifacts/**/*
          fail_on_unmatched_files: false
